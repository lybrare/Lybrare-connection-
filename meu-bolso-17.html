<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: #0a0d12;
  color: #f0f2f5;
  padding-bottom: 78px;
}
#app.fundo-perfil { background: #0a0d12; }

.topo {
  background: linear-gradient(135deg, #05070a, #0b3d91);
  color: white;
  padding: 16px 16px 20px;
  border-bottom: 1px solid #142032;
}
.linha-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar-mini {
  width: 40px; height: 40px; border-radius: 50%;
  background: #1462d4; color: white; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.saudacao { flex: 1; font-size: 17px; font-weight: 700; }
.icones-topo { display: flex; gap: 4px; }
.icone-btn { background: none; border: none; color: white; padding: 6px; cursor: pointer; }
.titulo-secao { font-size: 20px; font-weight: 700; color: white; }

.card-saldo-topo {
  background: #12161d;
  border: 1px solid #1e2530;
  border-radius: 14px;
  padding: 14px 16px;
}
.card-saldo-topo .label { color: #9fb4d8; font-size: 13px; }
.linha-valor-saldo { display: flex; align-items: center; justify-content: space-between; }
.linha-valor-saldo .icone-btn { color: #6fa2ff; }
.valor-grande { font-size: 26px; font-weight: 700; margin-top: 2px; color: #4f8cff; }

.mini-nav-mes { display: flex; align-items: center; gap: 6px; color: #cfe0ff; font-size: 14px; }
.seta-mes { background: none; border: none; color: #cfe0ff; font-size: 18px; cursor: pointer; padding: 2px 6px; }
.mes-label { min-width: 64px; text-align: center; }

.conteudo { padding: 14px; max-width: 560px; margin: 0 auto; }
h3 { margin: 18px 0 8px; font-size: 15px; color: #8fb4ff; }

.nav-mes { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
.mes-label-grande { font-size: 17px; font-weight: 700; color: #f0f2f5; text-transform: capitalize; }
.nav-mes .seta-mes { font-size: 22px; color: #6fa2ff; }

.linha-stats { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; }
.stat-card {
  background: #12161d;
  border: 1px solid #1e2530;
  border-radius: 14px;
  padding: 14px;
  min-width: 130px;
  flex-shrink: 0;
}
.stat-icone {
  width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; margin-bottom: 8px;
}
.stat-azul { background: rgba(79,140,255,0.18); color: #4f8cff; }
.stat-vermelho { background: rgba(239,68,68,0.18); color: #ef4444; }
.stat-verde { background: rgba(33,197,93,0.18); color: #21c55d; }
.stat-label { font-size: 12px; color: #8792a8; }
.stat-valor { font-size: 14px; font-weight: 700; color: #f0f2f5; margin-top: 2px; }

.card {
  background: #12161d;
  border: 1px solid #1e2530;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.card-insights { border-color: #1462d4; position: relative; cursor: pointer; }
.badge-premium {
  position: absolute; top: 12px; right: 12px;
  background: #f7a500; color: #241900; font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
}
.insights-titulo { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.tag-ia { background: #1462d4; color: white; font-size: 11px; padding: 2px 8px; border-radius: 10px; }

.cabecalho-secao { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.cabecalho-secao h3 { margin: 0; font-size: 15px; }
.btn-mais {
  width: 30px; height: 30px; border-radius: 8px;
  background: #182231; color: #6fa2ff; border: 1px solid #24344d;
  font-size: 17px; line-height: 1; cursor: pointer;
}

.lista-contas { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.conta-item {
  background: #12161d;
  border: 1px solid #1e2530;
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.conta-icone {
  width: 40px; height: 40px; border-radius: 10px;
  color: white; font-weight: 700; font-size: 11px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.cartao-badge {
  padding: 6px 8px; border-radius: 6px; color: white;
  font-weight: 700; font-size: 10px; letter-spacing: 0.3px; flex-shrink: 0;
}
.conta-meio { flex: 1; }
.conta-nome { font-weight: 600; font-size: 14px; color: #f0f2f5; }
.conta-tipo { font-size: 12px; color: #7a8699; }
.conta-saldo { font-weight: 700; font-size: 14px; color: #f0f2f5; }
.vazio { color: #6b7688; font-size: 13px; }

.btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600; margin-bottom: 10px; cursor: pointer;
}
.btn-primario { background: #1462d4; color: white; }
.btn-secundario { background: #182231; color: #6fa2ff; border: 1px solid #24344d; }
.btn-perigo { background: #2a1414; color: #ff5c5c; border: 1px solid #4a1f1f; }
